<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get World Quizzer</title>
  <meta name="description" content="Five quick geography questions a day: a flag, a map, a capital, and more.">
  <meta property="og:title" content="World Quizzer 🌍">
  <meta property="og:description" content="Five quick geography questions a day: a flag, a map, a capital, and more.">
  <meta property="og:type" content="website">
  <script>
    // Will, 2026-11-23: iPhone, iPad and Mac go to the App Store, Android to Google Play, and
    // anything else (Windows, Linux, unknown) stays here and sees both buttons. iPads say
    // they're a Mac, which lands them in the App Store too.
    (function () {
      var ua = navigator.userAgent;
      var apple = /iPhone|iPad|iPod|Macintosh/i.test(ua);
      var android = /Android/i.test(ua);
      if (apple) location.replace("https://apps.apple.com/app/id6823729546");
      else if (android) location.replace("https://play.google.com/store/apps/details?id=com.willseo.worldquizzer");
    })();
  </script>
  <style>
    :root { --ink: #1c2742; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, sans-serif;
      background: linear-gradient(#5bb3f0, #1f70c4); color: var(--ink); padding: 24px 16px;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 28px 24px; max-width: 380px; width: 100%;
      text-align: center; box-shadow: 0 8px 0 #c9d3e3, 0 14px 30px rgba(0,0,0,.18);
    }
    .icon { display: block; width: 80px; height: 80px; margin: 0 auto; border-radius: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    h1 { font-size: 26px; margin: 8px 0 4px; }
    p { line-height: 1.45; }
    .button {
      display: block; margin: 14px auto 0; padding: 14px 18px; border-radius: 16px; font-weight: 800;
      font-size: 18px; color: #fff; text-decoration: none; background: #2e9d4f; box-shadow: 0 5px 0 #1f7039;
    }
    .button.android { background: #2f6fd6; box-shadow: 0 5px 0 #1d4f9e; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="icon.png" alt="World Quizzer app icon">
    <h1>World Quizzer</h1>
    <p>Five quick geography questions a day: a flag, a map, a capital, and more.</p>
    <a class="button" href="https://apps.apple.com/app/id6823729546">Get it on the App Store</a>
    <a class="button android" href="https://play.google.com/store/apps/details?id=com.willseo.worldquizzer">Get it on Google Play</a>
  </main>
</body>
</html>
