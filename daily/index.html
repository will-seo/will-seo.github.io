<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Geography Quiz: Flags, Maps &amp; Capitals | World Quizzer</title>
  <meta name="description" content="Five quick geography questions a day: a flag, a map, a capital.">
  <link rel="canonical" href="https://will-seo.github.io/daily/">
  <link rel="icon" type="image/png" href="https://will-seo.github.io/get/icon.png">
  <link rel="apple-touch-icon" href="https://will-seo.github.io/get/icon.png">
  <meta property="og:title" content="World Quizzer Daily Quiz 🌍">
  <meta property="og:description" content="Five quick geography questions a day: a flag, a map, a capital.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="World Quizzer">
  <meta property="og:url" content="https://will-seo.github.io/daily/">
  <meta property="og:image" content="https://will-seo.github.io/daily/share.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="500">
  <meta property="og:image:alt" content="How well do you know the world? Countries, capitals, flags and US states, over a world map">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-itunes-app" content="app-id=6823729546">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "World Quizzer: Geography Quiz",
    "description": "Five quick geography questions a day: a flag, a map, a capital.",
    "url": "https://will-seo.github.io/daily/",
    "image": "https://will-seo.github.io/get/icon.png",
    "applicationCategory": "GameApplication",
    "operatingSystem": "iOS, Android",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
    "installUrl": [
      "https://apps.apple.com/app/id6823729546",
      "https://play.google.com/store/apps/details?id=com.willseo.worldquizzer"
    ]
  }
  </script>
  <style>
    :root { --blue: #2f6fd6; --green: #2e9d4f; --ink: #1c2742; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, sans-serif;
      background: linear-gradient(#5bb3f0, #1f70c4); color: var(--ink); padding: 24px;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 28px 24px; max-width: 380px; width: 100%;
      text-align: center; box-shadow: 0 8px 0 #c9d3e3, 0 14px 30px rgba(0,0,0,.18);
    }
    .globe { font-size: 56px; }
    h1 { font-size: 26px; margin: 8px 0 4px; }
    .number { color: #5b6680; font-weight: 700; margin: 0 0 16px; }
    p { line-height: 1.45; }
    .button {
      display: block; margin: 18px auto 6px; padding: 14px 18px; border-radius: 16px; font-weight: 800;
      font-size: 18px; color: #fff; text-decoration: none; background: var(--green); box-shadow: 0 5px 0 #1f7039;
    }
    .button.android { background: var(--blue); box-shadow: 0 5px 0 #1d4f9e; }
    .note { font-size: 14px; color: #5b6680; }
  </style>
</head>
<body>
  <main class="card">
    <div class="globe">🌍</div>
    <h1>World Quizzer Daily Quiz</h1>
    <p class="number" id="number"></p>
    <p>Five quick geography questions a day: a flag, a map, a capital.</p>

    <a class="button" href="https://apps.apple.com/app/id6823729546">Play on iPhone</a>
    <a class="button android" href="https://play.google.com/store/apps/details?id=com.willseo.worldquizzer">Play on Android</a>
    <p class="note">Already have World Quizzer? Tapping a shared link opens today's quiz in the app.</p>
  </main>

  <script>
    // "?n=12" is the quiz number from the shared message (the same for everyone on a day).
    var n = new URLSearchParams(location.search).get("n");
    if (n && /^\d+$/.test(n)) document.getElementById("number").textContent = "Daily #" + n;
  </script>
</body>
</html>
